# =============================================================================
# NEXUS OS — bootc-image-builder Configuration
# Target Base: Fedora 41 x86_64
# =============================================================================

[customizations.installer.kickstart]
contents = """
keyboard --vckeymap=us --xlayouts='us'
lang en_US.UTF-8
timezone UTC --utc
network --bootproto=dhcp --device=link --activate --onboot=on
rootpw --lock
user --name=nexus --plaintext --password=nexus --groups=wheel
"""
