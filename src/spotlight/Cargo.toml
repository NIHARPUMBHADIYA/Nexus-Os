[package]
name = "nexus-spotlight"
version = "0.1.0"
edition = "2021"
description = "NEXUS OS Universal Spotlight Search Daemon & Wayland HUD"
license = "Apache-2.0"

[dependencies]
tokio = { version = "1.40", features = ["full"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
thiserror = "1.0"
anyhow = "1.0"
fuzzy-matcher = "0.3"
