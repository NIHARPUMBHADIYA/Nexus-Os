name: Build NEXUS OS Fedora Live ISO

on:
  workflow_dispatch:
  push:
    branches: [ main, master ]
    paths-ignore:
      - 'README.md'
      - 'docs/**'
      - '.gitignore'

jobs:
  build-iso:
    name: Build Fedora 41 Live Workstation ISO
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Maximize Runner Disk Space
        run: |
          echo "=== Free disk space before cleanup ==="
          df -h
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /usr/local/share/boost
          sudo docker image prune -a -f || true
          echo "=== Free disk space after cleanup ==="
          df -h

      - name: Build NEXUS OS bootc Container
        run: |
          mkdir -p build
          docker build \
            --progress=plain \
            -t nexus-os:2026.1 \
            -f packaging/bootc/Containerfile .

      - name: Generate Bootable Fedora ISO via bootc-image-builder
        run: |
          docker run \
            --rm \
            --privileged \
            -v $(pwd)/build:/output \
            -v /var/lib/docker:/var/lib/docker \
            quay.io/centos-bootc/bootc-image-builder:latest \
            --type iso \
            --rootfs btrfs \
            nexus-os:2026.1

      - name: Package & Checksum Output ISO
        run: |
          echo "=== Locating built ISO file ==="
          ISO_SRC=$(find build -type f -name "*.iso" | head -n1)
          if [ -z "$ISO_SRC" ]; then
            echo "[-] Error: No ISO file was generated by bootc-image-builder."
            exit 1
          fi
          echo "[+] Found ISO: $ISO_SRC"
          mv "$ISO_SRC" build/nexus-os-2026.1-x86_64.iso
          cd build
          sha256sum nexus-os-2026.1-x86_64.iso > nexus-os-2026.1-x86_64.iso.sha256
          echo "=== ISO Details ==="
          ls -lh nexus-os-2026.1-x86_64.iso
          cat nexus-os-2026.1-x86_64.iso.sha256

      - name: Upload ISO Artifact
        uses: actions/upload-artifact@v4
        with:
          name: nexus-os-2026.1-fedora-x86_64-iso
          path: |
            build/nexus-os-2026.1-x86_64.iso
            build/nexus-os-2026.1-x86_64.iso.sha256
          retention-days: 14
          if-no-files-found: error
