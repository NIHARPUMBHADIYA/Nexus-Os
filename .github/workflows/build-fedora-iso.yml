name: Build NEXUS OS Fedora Live ISO

on:
  workflow_dispatch:
  push:
    branches: [ main, master ]
    paths-ignore:
      - 'README.md'
      - 'docs/**'
      - '.gitignore'

jobs:
  build-iso:
    name: Build Fedora 41 Live Workstation ISO
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Maximize Runner Disk Space
        run: |
          echo "=== Free disk space before cleanup ==="
          df -h
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /usr/local/share/boost /opt/hostedtoolcache
          sudo docker image prune -a -f || true
          sudo podman system prune -a -f || true
          echo "=== Free disk space after cleanup ==="
          df -h

      - name: Configure Host Security & Podman Storage
        run: |
          echo "=== Disabling AppArmor user namespace restrictions for osbuild/bwrap ==="
          sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0 || true
          sudo systemctl stop apparmor || true
          sudo aa-teardown || true
          sudo mkdir -p /etc/containers
          echo -e '[storage]\ndriver = "overlay"\nrunroot = "/run/containers/storage"\ngraphroot = "/var/lib/containers/storage"' | sudo tee /etc/containers/storage.conf

      - name: Build NEXUS OS bootc Container
        run: |
          mkdir -p build
          sudo podman build \
            --progress=plain \
            -t localhost/nexus-os:2026.1 \
            -f packaging/bootc/Containerfile . 2>&1 | tee /tmp/step5.log

      - name: Generate Bootable Fedora ISO via bootc-image-builder
        run: |
          set -x
          exec > >(tee -a /tmp/step6.log) 2>&1
          echo "=== Step 1: Listing local podman images ==="
          sudo podman images
          echo "=== Step 2: Inspecting kernel and initramfs inside container ==="
          sudo podman run --rm localhost/nexus-os:2026.1 sh -c 'ls -la /usr/lib/modules/' || true
          echo "=== Step 3: Checking bootc-image-builder help ==="
          sudo podman run --rm quay.io/centos-bootc/bootc-image-builder:latest build --help || true
          echo "=== Step 4: Executing bootc-image-builder for ISO generation ==="
          sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0 || true
          sudo aa-teardown || true
          sudo podman run \
            --rm \
            --privileged \
            --security-opt label=type:unconfined_t \
            --security-opt apparmor=unconfined \
            --security-opt seccomp=unconfined \
            --cap-add=ALL \
            -v /dev:/dev \
            -v $(pwd)/build:/output \
            -v $(pwd)/packaging/bootc/data/repositories:/usr/share/osbuild-composer/repositories:ro \
            -v $(pwd)/packaging/bootc/data/repositories:/etc/osbuild-composer/repositories:ro \
            -v /var/lib/containers/storage:/var/lib/containers/storage \
            quay.io/centos-bootc/bootc-image-builder:latest \
            --log-level info \
            build \
            --type iso \
            --rootfs ext4 \
            --output /output \
            --force-repo https://dl.fedoraproject.org/pub/archive/fedora/linux/releases/41/Everything/x86_64/os/ \
            --force-repo https://dl.fedoraproject.org/pub/archive/fedora/linux/updates/41/Everything/x86_64/ \
            localhost/nexus-os:2026.1

      - name: Package & Checksum Output ISO
        run: |
          sudo chown -R $(id -u):$(id -g) build
          echo "=== Locating built ISO file ==="
          find build -type f -ls
          ISO_SRC=$(find build -type f -name "*.iso" | head -n1)
          if [ -z "$ISO_SRC" ]; then
            echo "[-] Error: No ISO file was generated by bootc-image-builder."
            exit 1
          fi
          echo "[+] Found ISO: $ISO_SRC"
          mv "$ISO_SRC" build/nexus-os-2026.1-x86_64.iso
          cd build
          sha256sum nexus-os-2026.1-x86_64.iso > nexus-os-2026.1-x86_64.iso.sha256
          echo "=== ISO Details ==="
          ls -lh nexus-os-2026.1-x86_64.iso
          cat nexus-os-2026.1-x86_64.iso.sha256

      - name: Upload ISO Artifact
        uses: actions/upload-artifact@v4
        with:
          name: nexus-os-2026.1-fedora-x86_64-iso
          path: |
            build/nexus-os-2026.1-x86_64.iso
            build/nexus-os-2026.1-x86_64.iso.sha256
          retention-days: 14
          if-no-files-found: error

      - name: Save and Push Debug Logs to Git Branch
        if: always()
        run: |
          mkdir -p ci-logs
          echo "Run ID: ${{ github.run_id }}" > ci-logs/summary.txt
          cat /tmp/step5.log >> ci-logs/summary.txt 2>/dev/null || true
          cat /tmp/step6.log >> ci-logs/summary.txt 2>/dev/null || true
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git checkout -B ci-debug-logs
          git add -f ci-logs/
          git commit -m "ci: debug logs for run ${{ github.run_id }}" || true
          git push -f origin ci-debug-logs || true
